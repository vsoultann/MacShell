<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- MacShell: Apple's emoji, everywhere (installed in ~/.local/share/fonts/apple-emoji).
     For the generic families it is the first fallback, right after their text fonts (accept, weak), never before
     them (a strong binding outranks the text fonts wherever it sits):
     "prefer" made sans-serif itself resolve to the emoji font, and apps that just ask for sans-serif (VLC, other
     Qt5 apps) drew only the few letters it has. -->
<fontconfig>
  <alias binding="strong"><family>emoji</family><prefer><family>Apple Color Emoji</family></prefer></alias>
  <alias binding="weak"><family>sans-serif</family><accept><family>Apple Color Emoji</family></accept></alias>
  <alias binding="weak"><family>serif</family><accept><family>Apple Color Emoji</family></accept></alias>
  <alias binding="weak"><family>monospace</family><accept><family>Apple Color Emoji</family></accept></alias>
  <match target="pattern">
    <test name="family"><string>Noto Color Emoji</string></test>
    <edit name="family" mode="prepend" binding="same"><string>Apple Color Emoji</string></edit>
  </match>
</fontconfig>
